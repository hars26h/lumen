:root {
  --bg: #F6F8F6;
  --card: #FFFFFF;
  --dim: #EEF3EF;
  --ink: #0D1F17;
  --ink-secondary: #24352D;
  --ink-muted: #576E62;

  --sun-soft: #FEF3C7;
  --leaf: #14532D;
  --leaf-dark: #0D381E;
  --leaf-soft: #DCFCE7;
  --emerald: #10B981;
  --emerald-soft: #E8F8F0;
  --purple: #7C3AED;
  --purple-soft: #F3E8FF;
  --danger: #DC2626;
  --danger-soft: #FEE2E2;
  --line: rgba(13, 31, 23, 0.08);
  --radius-sm: 8px;
  --radius-md: 14px;

  --shadow-sm: 0 4px 12px rgba(13, 31, 23, 0.05);

* { box-sizing: border-box; margin: 0; padding: 0; }
body {

  line-height: 1.5;
}
h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; letter-spacing: -0.025em; }
.mono { font-family: 'JetBrains Mono', monospace; }
button { font-family: inherit; cursor: pointer; }
a { text-decoration: none; color: inherit; }

/* Navigation */
.topbar {
  background: rgba(255, 255, 255, 0.95);

  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;

  box-shadow: 0 1px 3px rgba(13, 31, 23, 0.03);
}
.brand-group { display: flex; align-items: center; gap: 12px; }
.brand-icon {
  width: 38px; height: 38px; border-radius: 12px;

.brand-text h1 { font-size: 19px; line-height: 1.1; font-weight: 800; color: var(--ink); }
.brand-text small {

}

.nav-tabs {

}
.nav-tabs button {

.nav-tabs button:not(.active):hover { color: var(--ink); background: rgba(0,0,0,0.03); }

.topbar-right { display: flex; align-items: center; gap: 12px; }
.lumen-pill {

.avatar-badge:hover { border-color: var(--leaf); transform: scale(1.04); }

main { max-width: 1140px; margin: 0 auto; padding: 28px 24px 70px; }

/* Cards & Layout */
.card {
  background: var(--card); border: 1px solid var(--line);

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 900px) {
  .grid2, .grid3, .grid4 { grid-template-columns: 1fr; }
  .topbar { flex-direction: column; gap: 12px; }
}

.btn {
  border: none; border-radius: 10px; padding: 10px 18px; font-size: 13px; font-weight: 600;

.btn-primary { background: var(--ink); color: #fff; }

.btn-leaf { background: var(--leaf); color: #fff; }

.btn-purple { background: var(--purple); color: #fff; }

.btn-ghost { background: var(--card); border: 1.5px solid var(--line); color: var(--ink-secondary); }
.btn-ghost:hover { border-color: var(--ink); color: var(--ink); }
.btn-danger { background: var(--danger); color: #fff; }

.badge.purple { background: var(--purple-soft); color: var(--purple); border: 1px solid rgba(124,58,237,0.2); }
.badge.danger { background: var(--danger-soft); color: var(--danger); border: 1px solid rgba(220,38,38,0.2); }
.badge.sun { background: var(--sun-soft); color: #92400E; border: 1px solid rgba(217,119,6,0.2); }

@keyframes pulse { to { box-shadow: 0 0 0 8px rgba(16,185,129,0); } }

.row-item:last-child { border-bottom: none; }
.row-item .val { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--leaf-dark); }

/* Toast Notification */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: #fff; padding: 13px 26px; border-radius: 100px;
  font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600;

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Real Device Camera Functions */
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    state.cameraStream = stream;
    state.cameraActive = true;
    render();
    setTimeout(() => {
      const vid = document.getElementById('webcamVideo');
      if (vid) vid.srcObject = stream;
    }, 100);
    toast("Camera activated! Frame your invoice or appliance.");
  } catch (err) {
    toast("Camera permission notice: Using Demo Presets instead.");
    console.error(err);
  }
}

function stopCamera() {
  if (state.cameraStream) {
    state.cameraStream.getTracks().forEach(track => track.stop());
    state.cameraStream = null;
  }
  state.cameraActive = false;
  render();
}

function captureCameraSnapshot() {
  stopCamera();
  simulateScan('valid');
}

async function simulateScan(type) {
  state.scanState = 'scanning';
  render();

  setTimeout(async () => {
    if (type === 'valid') {
      state.scanState = 'success';
      state.lastScannedDevice = { name: "Havells Solar 15W LED Desk Lamp", inv: "INV-90218-A", tech: "BEE 5-Star / Solar Hybrid", pts: 80 };
      state.myLumens += 80;
      state.activity.unshift({
        label: "Camera Verified: Solar Desk Lamp (INV-90218)",
        pts: 80,
        when: "Just now",
        badge: "Personal Purchase"
      });

      // Update Supabase if available
      if (supabaseClient && state.user && state.user.rollNo) {
        await supabaseClient.from('students').update({ lumens_balance: state.myLumens }).eq('roll_no', state.user.rollNo);
      }

      toast("🎉 Valid Solar Device verified! +80 Personal Lumens added.");
    } else if (type === 'fan') {
      state.scanState = 'success';
      state.lastScannedDevice = { name: "Atomberg 28W BLDC Energy Saver Fan", inv: "INV-84192-B", tech: "BEE 5-Star Certified", pts: 120 };
      state.myLumens += 120;
      state.activity.unshift({
        label: "Camera Verified: 5-Star BLDC Fan (INV-84192)",
        pts: 120,
        when: "Just now",
        badge: "Personal Purchase"
      });

      // Update Supabase if available
      if (supabaseClient && state.user && state.user.rollNo) {
        await supabaseClient.from('students').update({ lumens_balance: state.myLumens }).eq('roll_no', state.user.rollNo);
      }

      toast("🎉 5-Star BLDC Fan verified! +120 Personal Lumens added.");
    } else {
      state.scanState = 'duplicate_rejected';
      toast("❌ Fraud Blocked: Duplicate image hash detected!");

async function buyStoreItem(name, cost) {
  if (state.myLumens < cost) return;

  state.myLumens -= cost;

  // Sync updated balance to Supabase
  if (supabaseClient && state.user && state.user.rollNo) {
    try {
      await supabaseClient
        .from('students')
        .update({ lumens_balance: state.myLumens })
        .eq('roll_no', state.user.rollNo);
    } catch (e) {
      console.warn("Could not sync redemption balance to Supabase:", e);
    }
  }

  state.activity.unshift({ label: `Redeemed: ${name}`, pts: -cost, when: "Just now", badge: "Reward Purchase" });
  render();
  toast(`Redeemed ${name}! Item token generated.`);
}

          </div>
          <div>
            <span style="opacity:0.6; display:block;">Energy Classification</span>
            <strong style="color:var(--leaf);">${item.tech}</strong>
          </div>
          <div>
            <span style="opacity:0.6; display:block;">Perceptual Hash Fingerprint</span>
            <strong class="mono">${item.phash}</strong> (Unique Verified ✓)
          </div>
        </div>

        ${item.status === 'PENDING' ? `
          <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button class="btn btn-ghost" style="font-size:12px; padding:8px 14px;" onclick="wardenRejectOCR('${item.id}')">
              ❌ Reject / Flag Duplicate
            </button>
            <button class="btn btn-leaf" style="font-size:12px; padding:8px 16px;" onclick="wardenApproveOCR('${item.id}', ${item.pts})">
              ✅ Approve &amp; Award +${item.pts} Lu
            </button>
          </div>
        ` : `
          <div style="text-align:right; font-size:12px; font-weight:600; color:${item.status==='APPROVED'?'var(--leaf)':'var(--danger)'};">
            ${item.status === 'APPROVED' ? '✓ Credited to student balance and logged in ledger' : '✗ Submission rejected by Warden'}
          </div>
        `}
      </div>
    `).join('')}
  </div>`;
}

function wardenApproveOCR(id, pts) {
  const item = state.wardenPendingApprovals.find(a => a.id === id);
  if (item) item.status = 'APPROVED';
  render();
  toast(`Approved ${item.device}! +${pts} Lumens dispatched to student.`);
}

function wardenRejectOCR(id) {
  const item = state.wardenPendingApprovals.find(a => a.id === id);
  if (item) item.status = 'REJECTED';
  render();
  toast(`Rejected submission ${id}.`);
}

/* ----------------------------------------------------
   10. Navigation Shell & Render Dispatcher
---------------------------------------------------- */
function renderTopbar() {
  const isWarden = state.role === 'warden';

  const tabs = isWarden ? [
    ['warden_iot', '⚡ IoT Sub-Meters (Auto-Credit)'],
    ['warden_ocr', '📷 Photo OCR Approvals Queue'],
    ['leaderboard', '🏆 Hostel Board'],
    ['audit', '📊 Energy Audit']
  ] : [
    ['meter', '⚡ Sub-Meter (+10 Lu)'],
    ['camera_ai', '📷 Camera Scanner'],
    ['store', '🛍️ Monthly Store'],
    ['leaderboard', '🏆 Hostel Board'],
    ['audit', '📊 Energy Audit']
  ];

  return `
  <div class="topbar">
    <div class="brand-group">
      <div class="brand-icon">⚡</div>
      <div class="brand-text">
        <h1>Lumen</h1>
        <small>${isWarden ? 'Warden Admin Portal' : 'Campus Energy Ledger'}</small>
      </div>
    </div>

    <div class="nav-tabs">
      ${tabs.map(([k, l]) => `
        <button class="${state.tab === k ? 'active' : ''}" onclick="setTab('${k}')">${l}</button>
      `).join('')}
    </div>

    <div class="topbar-right">
      <span class="badge ${isWarden ? 'purple' : 'leaf'}">
        ${isWarden ? '👔 Warden' : '🎓 Student'}
      </span>
      ${!isWarden ? `
        <div class="lumen-pill">⚡ ${state.myLumens} <span style="font-weight:400; opacity:0.75; font-size:11px;">Lu</span></div>
      ` : ''}
      <div class="avatar-badge" title="${state.user ? state.user.name : ''}" onclick="doLogout()">
        ${state.user ? state.user.name.split(' ').map(n=>n[0]).join('') : 'U'}
      </div>
    </div>
  </div>`;
}

function render() {
  const app = document.getElementById('app');
  if (state.screen === 'login') {
    app.innerHTML = renderLogin();
    return;
  }

  let content = '';
  if (state.tab === 'warden_iot') content = renderWardenIoTTab();
  else if (state.tab === 'warden_ocr') content = renderWardenOCRTab();
  else if (state.tab === 'meter') content = renderMeterTab();
  else if (state.tab === 'camera_ai') content = renderCameraAITab();
  else if (state.tab === 'store') content = renderStore();
  else if (state.tab === 'leaderboard') content = renderLeaderboard();
  else if (state.tab === 'audit') content = renderAudit();

  app.innerHTML = `
    ${renderTopbar()}
    <main>${content}</main>
    <div style="text-align:center; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-muted); opacity:0.75; padding:20px 0 40px;">
      Lumen · Smart India Hackathon 2026 · Team innov8 · Dual Role MVP (Student &amp; Warden)
    </div>
  `;
}

// Initial render
render();
</script>
</body>
</html>
